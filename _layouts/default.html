<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="MobileOptimized" content="320" />
<meta name="generator" content="Jekyll v{{ jekyll.version }}" />
<meta name="HandheldFriendly" content="True">
<meta itemprop='name' content='{{ page.title | default: site.title | escape }}'>
<meta name="url" content="{{ page.url | replace:'/index.html','/' | absolute_url }}">
<meta name='robots' content='index,follow'>
<meta name="directory" content="submission">
<meta name="news_keywords" content="{{ site.keywords }}">
<meta name="keywords" content="{{ site.keywords }}"/>
<meta name="author" content="{{ site.author }}">
<meta name="theme-color" content="Canvas">
<meta name='coverage' content='Worldwide'>
<meta name='distribution' content='Global'>
<meta name='rating' content='General'>
<meta name='revisit-after' content='3 days'>
<meta name='subtitle' content='{{ page.title | default: site.title | escape }}'>
<meta name='target' content='all'>
<meta name="identifier-URL" content="{{ page.url | replace:'/index.html','/' | absolute_url }}">
<meta name='directory' content='submission'>
<meta name='abstract' content='{{ page.summary | default: site.desc | strip_html | normalize_whitespace | truncate: 160 | escape }}'>
<meta name="google-site-verification" content="iBQODYCusO1W6iCkWAhah1OaOiD78DLGwngJT4SUMTs" />
<title>{{ page.title | default: site.title | escape }}</title>
<meta name="title" content="{{ page.title | default: site.title | escape }}">
<meta name="description" content="{{ page.summary | default: site.desc | strip_html | normalize_whitespace | truncate: 160 | escape }}">
{% if page.date %}
<meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
<meta name="dc.date" content="{{ page.date | date_to_xmlschema }}">
{% endif %}
{% if page.last_modified_at %}
<meta property="article:modified_time" content="{{ page.last_modified_at | date_to_xmlschema }}">
{% endif %}
<link rel="canonical" href="{{ page.url | replace:'/index.html','/' | absolute_url }}" />
<link rel="shortlink" href="{{ page.url | replace:'/index.html','/' | absolute_url }}">
<link rel="alternate" type="application/rss+xml" href="{{ site.url }}/feed.xml">
<!-- Favicon -->
<link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/assets/icons/favicon-48x48.png">
<!-- Apple Touch Icon -->
<link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
<!-- Android Chrome -->
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/android-chrome-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/assets/icons/android-chrome-512x512.png">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
     
    <style>
        /* Custom B&W overrides for a true minimalist feel */
        :root[data-theme="light"] {
            --b1: 100% 0 0; /* Pure White */
            --bc: 0% 0 0;   /* Pure Black Text */
        }
        :root[data-theme="dark"] {
            --b1: 0% 0 0;   /* Pure Black */
            --bc: 100% 0 0; /* Pure White Text */
        }
        .product-card img {
            filter: grayscale(0%);
            transition: filter 0.3s ease;
        }
        .product-card:hover img {
            filter: grayscale(100%);
        }
    /* Custom Scrollbar untuk Desktop agar user tahu bisa di-scroll */
    .custom-scrollbar::-webkit-scrollbar {
        height: 2px; /* Sangat tipis dan minimalis */
    }
    .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.05);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
        background: currentColor; /* Mengikuti warna teks (hitam di light, putih di dark) */
    }

    /* Sembunyikan scrollbar di mobile untuk tampilan lebih clean */
    @media (max-width: 768px) {
        .custom-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .custom-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    }
        #hidden-content { display: none; }
        #error-message { display: none; }
        .btn-logout { display: none; margin-top: 20px; padding: 10px 20px; background-color: #f44336; color: white; border: none; cursor: pointer; border-radius: 4px; }        
    </style>
</head>
<body class="min-h-screen bg-base-100 text-base-content font-sans transition-colors duration-300">
  {% include navbar.html %} 
<main class="max-w-7xl mx-auto p-4 md:p-12">
  {{ content }}
</main>
  {% include footer.html %} 
  {% include scripts.html %} 
</body>
</html>
