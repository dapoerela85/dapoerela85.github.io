---
layout: default
---
<div class="grid grid-cols-1 lg:grid-cols-2 gap-16 items-start">
            <div class="space-y-4">
                <div class="aspect-square bg-base-200 border border-base-content/5 overflow-hidden">
                    <img src="{{ page.img }}" 
                         alt="{{ page.title }}" class="product-image object-cover w-full h-full" />
                </div>
                <div class="grid grid-cols-4 gap-4">
                    <div class="aspect-square bg-base-200 border border-base-content/10"></div>
                    <div class="aspect-square bg-base-200 border border-base-content/10"></div>
                    <div class="aspect-square bg-base-200 border border-base-content/10"></div>
                    <div class="aspect-square bg-base-200 border border-base-content/10"></div>
                </div>
            </div>

            <div class="flex flex-col h-full">
                <header class="border-b border-base-content pb-6">
                    <h1 class="text-4xl md:text-6xl font-black uppercase tracking-tighter mb-2">{{ page.title }}</h1>
                    <p class="text-2xl font-mono">IDR {{ page.price }}</p>
                </header>

                <div class="py-8 space-y-6">
                    <p class="leading-relaxed opacity-70">
                        {{ content }}
                    </p>
                    
                    <div class="form-control w-full max-w-xs">
                        <label class="label"><span class="label-text text-xs uppercase tracking-widest font-bold">Size</span></label>
                        <select class="select select-bordered rounded-none border-base-content/20 focus:outline-none focus:border-base-content">
                            <option>250g Jar</option>
                            <option>500g Value Pack</option>
                        </select>
                    </div>

                    <div class="flex flex-col sm:flex-row gap-4 pt-4">
                        <div class="join border border-base-content/20 rounded-none w-fit">
                            <button class="join-item btn btn-ghost btn-md px-4">-</button>
                            <input class="join-item input input-ghost w-16 text-center focus:outline-none" value="1" />
                            <button class="join-item btn btn-ghost btn-md px-4">+</button>
                        </div>
                        <button class="btn btn-block sm:flex-1 bg-base-content text-base-100 hover:bg-base-content/80 rounded-none uppercase border-none">
                            Add to Shopping Bag
                        </button>
                    </div>
                </div>

                <div class="mt-auto pt-8 border-t border-base-content/10">
                    <div class="collapse collapse-plus rounded-none">
                        <input type="radio" name="details-accordion" checked="checked" /> 
                        <div class="collapse-title text-sm uppercase tracking-widest font-bold">Ingredients</div>
                        <div class="collapse-content text-sm opacity-60">
                            <p>Green Chili, Shallots, Garlic, Salt, Coconut Oil, Traditional Spices.</p>
                        </div>
                    </div>
                    <div class="collapse collapse-plus rounded-none border-t border-base-content/10">
                        <input type="radio" name="details-accordion" /> 
                        <div class="collapse-title text-sm uppercase tracking-widest font-bold">Shipping Info</div>
                        <div class="collapse-content text-sm opacity-60">
                            <p>Same-day delivery available for Jakarta area. Standard shipping 2-3 days for Java Island.</p>
                        </div>
                    </div>
                </div>
            </div>
         
       </div>
