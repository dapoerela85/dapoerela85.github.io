title               : "Dapoer Ela 85"
desc                : "Jajanan tradisional dalam kemasan modern."
baseurl             : "/"
keywords            : "basreng, camilan, cemilan, tangsel, kota tangerang selatan, store, frozen, food, banten, indonesia, oleh-oleh, rempoa"
url                 : "/"
github_username     : dapoerela85
permalink           : pretty
markdown            : kramdown
paginate            : 9
paginate_path       : "/products/:num/"

legalitas:
  nib: 
    - nomor: 1005240054558
      instansi: BKPM
  halal: 
    - nomor: ID36410025276910825
      instansi: BPJPH
  merk: 
    - nomor: DID2024133737
      instansi: DJKI
      url: "https://haki.id/merek/DID2024133737"
  pirt: 
    - nomor: Belum ada
      instansi: BPOM
      
include:
  - _pages

compress_html:
  clippings: false

plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap

exclude:
  - bin
  - config
  - vite.config.ts
  - tmp
  - Procfile.dev
  - docs/
  - vendor/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - Makefile
  - README.md
  - sample*.png
  - .gitignore
  - README
  - gemfile
  - Gemfile.lock
  - node_modules
  - jekyll-cache
  - LICENSE
  - CODE_OF-CONDUCT

defaults:
  - scope:
      path: "_posts/**"
      type: posts
    values:
      layout: post
      permalink: /products/:title/
  - scope:
      path: "_pages"
      type: "pages"
    values:
      layout: page
  - scope:
      path: ""
      type: "category"
    values:
      layout: category
      
collections:
  category:
    output: true
