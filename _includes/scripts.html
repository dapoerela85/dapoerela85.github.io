        const themeToggle = document.querySelector('#theme-toggle');
        const html = document.querySelector('html');

        // 1. Load theme from localStorage or system preference
        const currentTheme = localStorage.getItem('theme') || 
                            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

        // 2. Set initial state
        html.setAttribute('data-theme', currentTheme);
        themeToggle.checked = currentTheme === 'dark';

            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });
    </script>
<script>
const pwaBtn = document.getElementById('pwa-control-btn');
let deferredPrompt;

// Function to check if the user is currently using the app version
const isStandalone = () => {
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
};

// 1. Initial State Check
if (isStandalone()) {
  // User is already IN the app, so hide the button entirely
  pwaBtn.classList.add('hidden');
}

// 2. Listen for Installability (Not yet installed)
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  
  pwaBtn.innerText = "Install App"; // Set text to Install
  pwaBtn.classList.remove('hidden');
});

// 3. Handle Button Click
pwaBtn.addEventListener('click', async () => {
  if (deferredPrompt) {
    // TRIGGER INSTALL
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') {
      deferredPrompt = null;
      pwaBtn.classList.add('hidden');
    }
  } else {
    // FALLBACK: OPEN IN APP
    // If there is no install prompt, but the button is visible,
    // we assume it's installed or they are on a mobile browser.
    // Redirecting to the start_url often triggers the "Open in App" banner.
    window.location.href = '/'; 
  }
});

// 4. Handle successful installation
window.addEventListener('appinstalled', () => {
  pwaBtn.innerText = "Open in App";
  // Optional: hide it after installation to avoid confusion
  pwaBtn.classList.add('hidden'); 
});
</script>

<!-- SCRIPT LOGIKA REKENING & INTERAKSI VARIAN -->
<script>
  // State Inisialisasi
  let selectedProductTitle = "{{ page.title }}";
  let selectedKemasan = ""; // Kosong di awal agar tombol disabled
  let selectedRasa = "{% if page.varian.rasa %}{{ page.varian.rasa[0].name }}{% else %}Original{% endif %}";
  let currentAccountNumber = "";

  function formatRupiah(number) {
    return new Intl.NumberFormat('id-ID').format(number);
  }

  // 1. Handler Klik Varian Kemasan & Aktivasi Tombol Preorder
  function selectVariant(element) {
    selectedKemasan = element.getAttribute('data-name');
    const imgUrl = element.getAttribute('data-img');
    const price = element.getAttribute('data-price');
    const weight = element.getAttribute('data-weight');

    // Update foto utama & label harga
    const mainImg = document.getElementById('main-product-img');
    if (imgUrl && mainImg) mainImg.src = imgUrl;

    const displayLabel = document.getElementById('display-label');
    const displayPrice = document.getElementById('display-price');
    const displayWeight = document.getElementById('display-weight');

    if (displayLabel) displayLabel.textContent = 'Harga Varian: ' + selectedKemasan;
    if (displayPrice) displayPrice.textContent = 'Rp ' + formatRupiah(price);
    if (displayWeight) displayWeight.textContent = '(' + weight + ')';

    // Highlight aktif pada kartu kemasan
    const allCards = document.querySelectorAll('.variant-card');
    allCards.forEach(card => {
      card.classList.remove('border-amber-500', 'ring-2', 'ring-amber-500/20', 'bg-amber-50/10');
      card.classList.add('border-gray-200');
    });

    element.classList.remove('border-gray-200');
    element.classList.add('border-amber-500', 'ring-2', 'ring-amber-500/20', 'bg-amber-50/10');

    // --- AKTIFKAN TOMBOL PREORDER ---
    const btnPreorder = document.getElementById('btnPreorder');
    const btnPreorderText = document.getElementById('btnPreorderText');
    const variantAlert = document.getElementById('variant-alert');

    if (btnPreorder) {
      btnPreorder.disabled = false;
      btnPreorder.className = "w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 text-base cursor-pointer";
      btnPreorderText.textContent = "Preorder Sekarang";
    }

    if (variantAlert) {
      variantAlert.classList.add('hidden');
    }

    updatePesananString();
  }

  // 2. Handler Klik Varian Rasa
  function selectRasa(element) {
    selectedRasa = element.getAttribute('data-rasa');

    const allRasaCards = document.querySelectorAll('.rasa-card');
    allRasaCards.forEach(card => {
      card.classList.remove('border-amber-500', 'bg-amber-50', 'text-amber-900', 'ring-2', 'ring-amber-500/20');
      card.classList.add('bg-gray-100', 'text-gray-700', 'border-gray-200');
    });

    element.classList.remove('bg-gray-100', 'text-gray-700', 'border-gray-200');
    element.classList.add('border-amber-500', 'bg-amber-50', 'text-amber-900', 'ring-2', 'ring-amber-500/20');

    updatePesananString();
  }

  // 3. Format Nilai Col E (Judul, Kemasan, Rasa, Qty)
  function getPesananString() {
    const qtyInput = document.getElementById('custQty');
    const qty = qtyInput ? qtyInput.value : 1;
    return `${selectedProductTitle}, ${selectedKemasan || 'Belum Dipilih'}, ${selectedRasa}, ${qty}`;
  }

  // 4. Update Tampilan Ringkasan Modal
  function updatePesananString() {
    const summary = getPesananString();
    
    const summaryEl = document.getElementById('summaryPesanan');
    const kemasanLabelEl = document.getElementById('modalKemasanLabel');
    const rasaLabelEl = document.getElementById('modalRasaLabel');

    if (summaryEl) summaryEl.textContent = summary;
    if (kemasanLabelEl) kemasanLabelEl.textContent = selectedKemasan || '-';
    if (rasaLabelEl) rasaLabelEl.textContent = selectedRasa;
  }

  // 5. Logika Pilihan Bank & Copy Rekening
  function handleBankChange(event) {
    const selectedOption = event.target.options[event.target.selectedIndex];
    const accountNumber = selectedOption.getAttribute('data-account');
    const accountHolder = selectedOption.getAttribute('data-holder');

    const infoBox = document.getElementById('accountInfoBox');
    const numberDisplay = document.getElementById('accountNumberDisplay');
    const holderDisplay = document.getElementById('accountHolderDisplay');

    if (accountNumber) {
      currentAccountNumber = accountNumber;
      numberDisplay.innerText = accountNumber;
      holderDisplay.innerText = `a.n ${accountHolder}`;
      infoBox.classList.remove('hidden');
      resetCopyButton();
    } else {
      infoBox.classList.add('hidden');
    }
  }

  function copyAccountNumber() {
    if (!currentAccountNumber) return;

    navigator.clipboard.writeText(currentAccountNumber).then(() => {
      const copyBtnText = document.getElementById('copyBtnText');
      if (copyBtnText) copyBtnText.innerText = 'Tersalin!';

      setTimeout(() => {
        resetCopyButton();
      }, 2000);
    }).catch(err => {
      console.error('Gagal menyalin: ', err);
    });
  }

  function resetCopyButton() {
    const copyBtnText = document.getElementById('copyBtnText');
    if (copyBtnText) copyBtnText.innerText = 'Salin';
  }

  // 6. Kontrol Buka & Tutup Modal
  function openOrderModal() {
    if (!selectedKemasan) {
      alert("Silakan pilih varian kemasan & ukuran terlebih dahulu.");
      return;
    }
    updatePesananString();
    document.getElementById('orderModal').classList.remove('hidden');
  }

function submitOrder(e) {
  e.preventDefault();

  const scriptURL = 'https://script.google.com/macros/s/AKfycbyPVFrbp7ssV1m4mUMUnjRoOL5IyAv1vuvbxrHiUeQL97NY2M3WepKuyZ25FgwUhluq/exec';
  const btnSubmit = document.getElementById('btnSubmit');
  const statusEl = document.getElementById('orderStatus');

  btnSubmit.disabled = true;
  btnSubmit.textContent = "Mengirim...";
  statusEl.classList.add('hidden');

  // Gunakan URLSearchParams agar kompatibel penuh dengan Google Apps Script
  const formData = new URLSearchParams();
  formData.append('date', new Date().toLocaleString("id-ID"));
  formData.append('name', document.getElementById('custName').value);
  formData.append('telp', document.getElementById('custTelp').value);
  formData.append('alamat', document.getElementById('custAlamat').value);
  formData.append('pesanan', getPesananString());
  formData.append('keterangan', document.getElementById('custKeterangan').value || '-');
  formData.append('bank', document.getElementById('custBank').value);

  fetch(scriptURL, {
    method: 'POST',
    mode: 'no-cors',
    headers: {
      'Content-Type': 'application/x-www-form-urlencoded'
    },
    body: formData.toString()
  })
  .then(() => {
    statusEl.className = "mb-4 p-3 rounded-lg text-sm font-medium bg-green-100 text-green-800 border border-green-200";
    statusEl.textContent = "✅ Pesanan berhasil dikirim! Kami akan menghubungi Anda segera.";
    statusEl.classList.remove('hidden');
    
    document.getElementById('orderForm').reset();
    document.getElementById('accountInfoBox').classList.add('hidden');
    updatePesananString();
    btnSubmit.disabled = false;
    btnSubmit.textContent = "Kirim Pesanan";
  })
  .catch(error => {
    console.error('Error:', error);
    statusEl.className = "mb-4 p-3 rounded-lg text-sm font-medium bg-red-100 text-red-800 border border-red-200";
    statusEl.textContent = "❌ Gagal mengirim pesanan. Silakan coba lagi.";
    statusEl.classList.remove('hidden');
    
    btnSubmit.disabled = false;
    btnSubmit.textContent = "Kirim Pesanan";
  });
}

// Fungsi Menutup Modal Order
function closeOrderModal() {
  const modal = document.getElementById('orderModal');
  if (modal) {
    modal.classList.add('hidden');
  }

  // Sembunyikan notifikasi status jika ada
  const statusEl = document.getElementById('orderStatus');
  if (statusEl) {
    statusEl.classList.add('hidden');
  }
}

// Fitur Tambahan: Tutup modal ketika mengklik area luar (backdrop hitam)
function handleOverlayClick(event) {
  if (event.target.id === 'orderModal') {
    closeOrderModal();
  }
}

// Fitur Tambahan: Tutup modal ketika menekan tombol Escape di keyboard
document.addEventListener('keydown', function(event) {
  if (event.key === 'Escape') {
    closeOrderModal();
  }
});
</script>
