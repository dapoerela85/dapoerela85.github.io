   <script>
        const themeToggle = document.querySelector('#theme-toggle');
        const html = document.querySelector('html');

        // 1. Load theme from localStorage or system preference
        const currentTheme = localStorage.getItem('theme') || 
                            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

        // 2. Set initial state
        html.setAttribute('data-theme', currentTheme);
        themeToggle.checked = currentTheme === 'dark';

        // 3. Listen for changes
        themeToggle.addEventListener('change', (e) => {
            const newTheme = e.target.checked ? 'dark' : 'light';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });
    </script>
<script>
const pwaBtn = document.getElementById('pwa-control-btn');
let deferredPrompt;

// Function to check if the user is currently using the app version
const isStandalone = () => {
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
};

// 1. Initial State Check
if (isStandalone()) {
  // User is already IN the app, so hide the button entirely
  pwaBtn.classList.add('hidden');
}

// 2. Listen for Installability (Not yet installed)
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  
  pwaBtn.innerText = "Install App"; // Set text to Install
  pwaBtn.classList.remove('hidden');
});

// 3. Handle Button Click
pwaBtn.addEventListener('click', async () => {
  if (deferredPrompt) {
    // TRIGGER INSTALL
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') {
      deferredPrompt = null;
      pwaBtn.classList.add('hidden');
    }
  } else {
    // FALLBACK: OPEN IN APP
    // If there is no install prompt, but the button is visible,
    // we assume it's installed or they are on a mobile browser.
    // Redirecting to the start_url often triggers the "Open in App" banner.
    window.location.href = '/'; 
  }
});

// 4. Handle successful installation
window.addEventListener('appinstalled', () => {
  pwaBtn.innerText = "Open in App";
  // Optional: hide it after installation to avoid confusion
  pwaBtn.classList.add('hidden'); 
});
</script>
