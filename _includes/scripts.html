   <script>
        const themeToggle = document.querySelector('#theme-toggle');
        const html = document.querySelector('html');

        // 1. Load theme from localStorage or system preference
        const currentTheme = localStorage.getItem('theme') || 
                            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

        // 2. Set initial state
        html.setAttribute('data-theme', currentTheme);
        themeToggle.checked = currentTheme === 'dark';

        // 3. Listen for changes
        themeToggle.addEventListener('change', (e) => {
            const newTheme = e.target.checked ? 'dark' : 'light';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });
    </script>
<script>
let deferredPrompt;
const installBtn = document.getElementById('install-button');

// 1. Listen for the browser's install signal
window.addEventListener('beforeinstallprompt', (e) => {
  // Prevent the mini-infobar from appearing on mobile
  e.preventDefault();
  // Stash the event so it can be triggered later.
  deferredPrompt = e;
  // Update UI notify the user they can install the PWA
  installBtn.style.display = 'block';
});

// 2. Trigger the prompt when the user clicks your button
installBtn.addEventListener('click', async () => {
  if (deferredPrompt) {
    // Show the install prompt
    deferredPrompt.prompt();
    // Wait for the user to respond to the prompt
    const { outcome } = await deferredPrompt.userChoice;
    console.log(`User response to the install prompt: ${outcome}`);
    // We've used the prompt, and can't use it again
    deferredPrompt = null;
    // Hide our install button
    installBtn.style.display = 'none';
  }
});

// 3. (Optional) Log when the app is successfully installed
window.addEventListener('appinstalled', (event) => {
  console.log('PWA was installed successfully!');
}); 
</script>
