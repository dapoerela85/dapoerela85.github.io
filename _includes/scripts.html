   <script>
        const themeToggle = document.querySelector('#theme-toggle');
        const html = document.querySelector('html');

        // 1. Load theme from localStorage or system preference
        const currentTheme = localStorage.getItem('theme') || 
                            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

        // 2. Set initial state
        html.setAttribute('data-theme', currentTheme);
        themeToggle.checked = currentTheme === 'dark';

        // 3. Listen for changes
        themeToggle.addEventListener('change', (e) => {
            const newTheme = e.target.checked ? 'dark' : 'light';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });
    </script>
<script>
// Get a reference to your footer button
const installBtn = document.getElementById('install-button');
let deferredPrompt;

window.addEventListener('beforeinstallprompt', (e) => {
  // Prevent Chrome 67 and earlier from automatically showing the prompt
  e.preventDefault();
  // Stash the event so it can be triggered later.
  deferredPrompt = e;
  // Unhide the button in your footer
  installBtn.classList.remove('hidden');
});

installBtn.addEventListener('click', async () => {
  if (deferredPrompt) {
    // Show the browser's install prompt
    deferredPrompt.prompt();
    
    // Wait for the user to respond to the prompt
    const { outcome } = await deferredPrompt.userChoice;
    
    if (outcome === 'accepted') {
      console.log('User accepted the install prompt');
    } else {
      console.log('User dismissed the install prompt');
    }
    
    // We've used the prompt, so we hide the button again
    deferredPrompt = null;
    installBtn.classList.add('hidden');
  }
});

// Hide the button if the app is already installed
window.addEventListener('appinstalled', () => {
  installBtn.classList.add('hidden');
  deferredPrompt = null;
});
</script>
