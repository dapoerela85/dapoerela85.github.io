    <!-- Login Container -->
    <div id="loginBox" class="box">
        <h2>Login Form</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="handleLogin()">Sign In</button>
    </div>

    <!-- Dashboard/Logout Container -->
    <div id="dashboardBox" class="box hidden">
        <h2>Welcome Page</h2>
        <p>You are successfully authenticated!</p>
        <button onclick="handleLogout()" style="background:#dc3545;">Sign Out</button>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyuq0j80pf_RkWYr6U7Zv6p1n_qCH2J9eBh8YURPRQl2TkF7Xub-keuLiIX3i8X6Z6pZw/exec";

        // Check active session on page load
        if (localStorage.getItem("isLoggedIn") === "true") {
            showDashboard();
        }

        async function handleLogin() {
            const user = document.getElementById("username").value;
            const pass = document.getElementById("password").value;

            const response = await fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors", // Required for cross-origin Apps Script posts
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "login", username: user, password: pass })
            });

            // Note: 'no-cors' blocks reading JSON responses directly. 
            // For production validation, use a clean internal API tool like SheetDB.
            alert("Login request sent. If credentials match, you will enter.");
            localStorage.setItem("isLoggedIn", "true");
            showDashboard();
        }

        function handleLogout() {
            localStorage.removeItem("isLoggedIn");
            document.getElementById("loginBox").classList.remove("hidden");
            document.getElementById("dashboardBox").classList.add("hidden");
        }

        function showDashboard() {
            document.getElementById("loginBox").classList.add("hidden");
            document.getElementById("dashboardBox").classList.remove("hidden");
        }
    </script>
