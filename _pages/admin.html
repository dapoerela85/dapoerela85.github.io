<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restricted Google Login</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; text-align: center; }
        #hidden-content { display: none; margin-top: 20px; padding: 20px; border: 2px dashed #4CAF50; background-color: #e8f5e9; }
        #error-message { display: none; margin-top: 20px; color: red; font-weight: bold; }
        .btn-logout { display: none; margin-top: 20px; padding: 10px 20px; background-color: #f44336; color: white; border: none; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>

    <h2>Exclusive Content Portal</h2>
    
    <div id="g_id_onload"
         data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false">
    </div>
    
    <div style="display: flex; justify-content: center; margin-top: 20px;">
        <div class="g_id_signin" data-type="standard"></div>
    </div>

    <button id="logout-btn" class="btn-logout" onclick="logout()">Log Out</button>

    <div id="error-message">Access Denied: Your email is not authorized to view this content.</div>

    <div id="hidden-content">
        <h3>🎉 Welcome to the Secret Club!</h3>
        <p>This content is highly classified and only visible to specific Gmail users.</p>
    </div>

    <script>
        // 1. Define your list of allowed Gmail addresses
        const ALLOWED_EMAILS = [
            "saadahemail@gmail.com",
            "dapoerela85@gmail.com" // Add your email here to test
        ];

        // Helper function to decode the Google JWT Token
        function parseJwt(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // 2. Handle the Google Login Response
        function handleCredentialResponse(response) {
            // Decode the user identity data from Google
            const responsePayload = parseJwt(response.credential);
            const userEmail = responsePayload.email;

            console.log("Logged in user email: " + userEmail);

            // 3. Authorization Check
            if (ALLOWED_EMAILS.includes(userEmail.toLowerCase())) {
                // Success: Show content, show logout, hide errors/login button
                document.getElementById("hidden-content").style.display = "block";
                document.getElementById("logout-btn").style.display = "inline-block";
                document.getElementById("error-message").style.display = "none";
                document.querySelector(".g_id_signin").style.display = "none";
            } else {
                // Failure: Show error, keep content hidden
                document.getElementById("error-message").style.display = "block";
                document.getElementById("hidden-content").style.display = "none";
                
                // Optional: Forcefully sign them out immediately since they aren't allowed
                google.accounts.id.disableAutoSelect();
            }
        }

        // 4. Handle Logout
        function logout() {
            // Reset the Google Auth instance
            google.accounts.id.disableAutoSelect();
            
            // UI Reset
            document.getElementById("hidden-content").style.display = "none";
            document.getElementById("logout-btn").style.display = "none";
            document.getElementById("error-message").style.display = "none";
            document.querySelector(".g_id_signin").style.display = "block";
            
            // Reload page to fully reset state (optional but cleanest for frontend-only)
            location.reload();
        }
    </script>
</body>
</html>
