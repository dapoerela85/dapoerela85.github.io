---
layout: default
title : Katalog
permalink: /katalog/
---

        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-8">
          
            {% for post in site.categories[page.category] %}
            {% if post.in_stock == true %}
            <div class="item-card group flex flex-col">
                <div class="aspect-square bg-base-200 overflow-hidden border border-base-content/5 group-hover:border-base-content transition-all duration-300 relative">
                    <img src="https://images.unsplash.com/photo-1621447508323-271221c80041?auto=format&fit=crop&w=800" class="w-full h-full object-cover">
                    <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity bg-white/10 backdrop-blur-[2px] hidden md:flex">
                        <a href="https://wa.me/..." class="btn btn-sm rounded-none bg-base-content text-base-100 border-none px-6 text-[9px] uppercase font-bold tracking-widest">Chat Admin</a>
                    </div>
                </div>
                <div class="py-4 space-y-1">
                    <h2 class="text-xs font-bold uppercase tracking-widest truncate">{{ post.title }}</h2>
                    <p class="text-[10px] opacity-50">{{ post.weight }} • {{ post.category }}</p>
                    <p class="font-mono text-sm font-bold">IDR {{ post.price }} </p>
                    <a href="https://wa.me/..." class="btn btn-xs btn-outline rounded-none w-full mt-2 md:hidden text-[9px] border-base-content/20">Order via WA</a>
                </div>
            </div>
            {% else %}
            {% endif %}
            {% endfor %}
          
        </div>
